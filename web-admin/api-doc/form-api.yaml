openapi: 3.0.0
info:
  title: 表单生成器 API
  description: 表单生成器相关接口文档
  version: 1.0.0
  
servers:
  - url: /api

tags:
  - name: form-template
    description: 表单模板管理
  - name: form-share  
    description: 表单分享
  - name: form-submission
    description: 表单提交记录

components:
  schemas:
    FormTemplate:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 模板ID
        name:
          type: string
          description: 模板名称
        description:
          type: string
          description: 模板描述
        formItems:
          type: array
          description: 表单项配置
          items:
            type: object
        config:
          type: object
          description: 表单配置
          properties:
            submitUrl:
              type: string
              description: 提交地址
            method:
              type: string
              description: 请求方法
            successMsg:
              type: string
              description: 成功提示
            errorMsg:
              type: string
              description: 失败提示
        createTime:
          type: string
          format: date-time
          description: 创建时间
        updateTime:
          type: string
          format: date-time
          description: 更新时间
        createBy:
          type: string
          description: 创建者
        updateBy:
          type: string
          description: 更新者

    FormShare:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 分享ID
        templateId:
          type: integer
          format: int64
          description: 模板ID
        shareCode:
          type: string
          description: 分享码
        expireTime:
          type: string
          format: date-time
          description: 过期时间
        createTime:
          type: string
          format: date-time
          description: 创建时间
        createBy:
          type: string
          description: 创建者

    FormSubmission:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 提交ID
        templateId:
          type: integer
          format: int64
          description: 模板ID
        formData:
          type: object
          description: 表单数据
        submitTime:
          type: string
          format: date-time
          description: 提交时间
        submitBy:
          type: string
          description: 提交人

paths:
  /form/template/list:
    get:
      tags:
        - form-template
      summary: 获取表单模板列表
      parameters:
        - name: name
          in: query
          description: 模板名称
          required: false
          schema:
            type: string
        - name: pageNum
          in: query
          description: 页码
          required: true
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: 每页条数
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 状态码
                  msg:
                    type: string
                    description: 提示信息
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: 总记录数
                      list:
                        type: array
                        items:
                          $ref: '#/components/schemas/FormTemplate'

  /form/template:
    post:
      tags:
        - form-template
      summary: 创建表单模板
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - submitUrl
                - submitMethod
              properties:
                name:
                  type: string
                  description: 模板名称
                description:
                  type: string
                  description: 模板描述
                submitUrl:
                  type: string
                  description: 提交地址
                submitMethod:
                  type: string
                  description: 提交方法(POST/GET)
                successMessage:
                  type: string
                  description: 成功提示
                failMessage:
                  type: string
                  description: 失败提示
                formItems:
                  type: array
                  description: 表单项配置
                  items:
                    type: object
                config:
                  type: object
                  description: 表单配置
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 状态码
                  msg:
                    type: string
                    description: 提示信息
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                        description: 模板ID
    
    put:
      tags:
        - form-template
      summary: 更新表单模板
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - id
                - name
                - submitUrl
                - submitMethod
              properties:
                id:
                  type: integer
                  format: int64
                  description: 模板ID
                name:
                  type: string
                  description: 模板名称
                description:
                  type: string
                  description: 模板描述
                submitUrl:
                  type: string
                  description: 提交地址
                submitMethod:
                  type: string
                  description: 提交方法(POST/GET)
                successMessage:
                  type: string
                  description: 成功提示
                failMessage:
                  type: string
                  description: 失败提示
                formItems:
                  type: array
                  description: 表单项配置
                  items:
                    type: object
                config:
                  type: object
                  description: 表单配置
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 状态码
                  msg:
                    type: string
                    description: 提示信息
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                        description: 模板ID

  /form/template/{id}:
    delete:
      tags:
        - form-template
      summary: 删除表单模板
      parameters:
        - name: id
          in: path
          required: true
          description: 模板ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 状态码
                  msg:
                    type: string
                    description: 提示信息

  /form/share/create:
    post:
      tags:
        - form-share
      summary: 生成分享链接
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: integer
                  format: int64
                  description: 模板ID
                expireTime:
                  type: string
                  format: date-time
                  description: 过期时间
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 状态码
                  msg:
                    type: string
                    description: 提示信息
                  data:
                    type: object
                    properties:
                      shareCode:
                        type: string
                        description: 分享码
                      shareUrl:
                        type: string
                        description: 分享链接

  /form/share/{shareCode}:
    get:
      tags:
        - form-share
      summary: 获取分享表单信息
      parameters:
        - name: shareCode
          in: path
          required: true
          description: 分享码
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 状态码
                  msg:
                    type: string
                    description: 提示信息
                  data:
                    type: object
                    properties:
                      templateId:
                        type: integer
                        format: int64
                        description: 模板ID
                      formItems:
                        type: array
                        description: 表单项配置
                        items:
                          type: object
                      config:
                        type: object
                        description: 表单配置

  /form/submission/submit:
    post:
      tags:
        - form-submission
      summary: 提交表单数据
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                templateId:
                  type: integer
                  format: int64
                  description: 模板ID
                formData:
                  type: object
                  description: 表单数据
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 状态码
                  msg:
                    type: string
                    description: 提示信息
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                        description: 提交ID

  /form/submission/list:
    get:
      tags:
        - form-submission
      summary: 获取表单提交记录
      parameters:
        - name: templateId
          in: query
          description: 模板ID
          required: true
          schema:
            type: integer
            format: int64
        - name: pageNum
          in: query
          description: 页码
          required: true
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: 每页条数
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 状态码
                  msg:
                    type: string
                    description: 提示信息
                  data:
                    type: object
                    properties:
                      total:
                        type: integer
                        description: 总记录数
                      list:
                        type: array
                        items:
                          $ref: '#/components/schemas/FormSubmission' 