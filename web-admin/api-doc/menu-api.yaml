openapi: 3.0.0
info:
  title: 菜单管理接口文档
  version: 1.0.0
  description: 系统菜单管理相关接口

paths:
  /api//system/menu/list:
    get:
      summary: 获取菜单列表
      parameters:
        - name: keyword
          in: query
          description: 搜索关键字
          schema:
            type: string
        - name: status
          in: query
          description: 状态(0-正常,1-停用)
          schema:
            type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuListResponse'
              
  /api//system/menu/add:
    post:
      summary: 新增菜单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuAddRequest'
      responses:
        '200':
          description: 成功
          
  /api//system/menu/update:
    put:
      summary: 修改菜单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuUpdateRequest'
      responses:
        '200':
          description: 成功
          
  /api//system/menu/delete/{id}:
    delete:
      summary: 删除菜单
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          
  /api//system/menu/info/{id}:
    get:
      summary: 获取菜单详情
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuInfoResponse'
                
  /api//system/menu/tree:
    get:
      summary: 获取菜单树形数据
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuTreeResponse'
                
  /api//system/menu/check-permission:
    get:
      summary: 检查权限标识是否存在
      parameters:
        - name: permission
          in: query
          required: true
          schema:
            type: string
        - name: excludeId
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCheckResponse'

components:
  schemas:
    MenuItem:
      type: object
      properties:
        id:
          type: integer
        parentId:
          type: integer
        name:
          type: string
        icon:
          type: string
        type:
          type: string
        routePath:
          type: string
        componentPath:
          type: string
        permission:
          type: string
        sort:
          type: integer
        status:
          type: string
        createTime:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
            
    MenuListResponse:
      type: object
      properties:
        code:
          type: integer
        msg:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/MenuItem'
            
    MenuAddRequest:
      type: object
      required:
        - parentId
        - name
        - type
      properties:
        parentId:
          type: integer
        name:
          type: string
        icon:
          type: string
        type:
          type: string
          enum: [menu, button]
        routePath:
          type: string
        componentPath:
          type: string
        permission:
          type: string
        sort:
          type: integer
        status:
          type: string
          
    MenuUpdateRequest:
      type: object
      required:
        - id
        - parentId
        - name
        - type
      properties:
        id:
          type: integer
        parentId:
          type: integer
        name:
          type: string
        icon:
          type: string
        type:
          type: string
          enum: [menu, button]
        routePath:
          type: string
        componentPath:
          type: string
        permission:
          type: string
        sort:
          type: integer
        status:
          type: string
          
    MenuInfoResponse:
      type: object
      properties:
        code:
          type: integer
        msg:
          type: string
        data:
          $ref: '#/components/schemas/MenuItem'
          
    MenuTreeResponse:
      type: object
      properties:
        code:
          type: integer
        msg:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              parentId:
                type: integer
              name:
                type: string
              children:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
                  
    MenuCheckResponse:
      type: object
      properties:
        code:
          type: integer
        msg:
          type: string
        data:
          type: boolean 