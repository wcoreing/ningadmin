openapi: 3.0.0
info:
  title: 用户管理接口文档
  description: 提供用户管理相关的接口，包括用户的增删改查等功能
  version: 1.0.0

servers:
  - url: /api
    description: 开发环境

components:
  schemas:
    User:
      type: object
      properties:
        userId:
          type: integer
          format: int64
          description: 用户ID
        userName:
          type: string
          description: 用户账号
        nickName:
          type: string
          description: 用户昵称
        password:
          type: string
          description: 密码
        email:
          type: string
          format: email
          description: 用户邮箱
        phonenumber:
          type: string
          description: 手机号码
        sex:
          type: string
          enum: ['0', '1', '2']
          description: 用户性别（0男 1女 2未知）
        avatar:
          type: string
          description: 头像地址
        status:
          type: string
          enum: ['0', '1']
          description: 帐号状态（0正常 1停用）
        createTime:
          type: string
          format: date-time
          description: 创建时间
        createBy:
          type: string
          description: 创建者
        updateTime:
          type: string
          format: date-time
          description: 更新时间
        updateBy:
          type: string
          description: 更新者
    
    PageResult:
      type: object
      properties:
        total:
          type: integer
          description: 总记录数
        list:
          type: array
          items:
            $ref: '#/components/schemas/User'
          description: 用户列表数据
    
    Result:
      type: object
      properties:
        code:
          type: integer
          description: 响应码
        msg:
          type: string
          description: 响应消息
        data:
          type: object
          description: 响应数据

paths:
  /system/user/list:
    get:
      tags:
        - 用户管理
      summary: 获取用户列表
      description: 分页查询用户列表
      parameters:
        - name: pageNum
          in: query
          description: 当前页码
          required: true
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          description: 每页记录数
          required: true
          schema:
            type: integer
            minimum: 1
            default: 10
        - name: userName
          in: query
          description: 用户账号
          schema:
            type: string
        - name: status
          in: query
          description: 用户状态
          schema:
            type: string
            enum: ['0', '1']
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - properties:
                      data:
                        $ref: '#/components/schemas/PageResult'

  /system/user/info/{userId}:
    get:
      tags:
        - 用户管理
      summary: 获取用户详情
      description: 根据用户ID获取用户详细信息
      parameters:
        - name: userId
          in: path
          required: true
          description: 用户ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Result'
                  - properties:
                      data:
                        $ref: '#/components/schemas/User'

  /system/user:
    post:
      tags:
        - 用户管理
      summary: 新增用户
      description: 创建新用户
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userName
                - password
                - nickName
              properties:
                userName:
                  type: string
                  description: 用户账号
                password:
                  type: string
                  description: 密码
                nickName:
                  type: string
                  description: 用户昵称
                email:
                  type: string
                  format: email
                  description: 邮箱
                phonenumber:
                  type: string
                  description: 手机号码
                sex:
                  type: string
                  enum: ['0', '1', '2']
                  description: 性别
                status:
                  type: string
                  enum: ['0', '1']
                  description: 状态
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

    put:
      tags:
        - 用户管理
      summary: 修改用户
      description: 更新用户信息
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: integer
                  format: int64
                  description: 用户ID
                userName:
                  type: string
                  description: 用户账号
                nickName:
                  type: string
                  description: 用户昵称
                email:
                  type: string
                  format: email
                  description: 邮箱
                phonenumber:
                  type: string
                  description: 手机号码
                sex:
                  type: string
                  enum: ['0', '1', '2']
                  description: 性别
                status:
                  type: string
                  enum: ['0', '1']
                  description: 状态
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /system/user/delete/{userId}:
    delete:
      tags:
        - 用户管理
      summary: 删除用户
      description: 根据用户ID删除用户
      parameters:
        - name: userId
          in: path
          required: true
          description: 用户ID
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /system/user/status:
    put:
      tags:
        - 用户管理
      summary: 修改用户状态
      description: 启用或停用用户账号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - status
              properties:
                userId:
                  type: integer
                  format: int64
                  description: 用户ID
                status:
                  type: string
                  enum: ['0', '1']
                  description: 帐号状态（0正常 1停用）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result'

  /system/user/password:
    put:
      tags:
        - 用户管理
      summary: 重置密码
      description: 重置用户密码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - password
              properties:
                userId:
                  type: integer
                  format: int64
                  description: 用户ID
                password:
                  type: string
                  description: 新密码
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Result' 