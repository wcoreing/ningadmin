# redis configuration
redis:
  - game:
      #是否使用redis集群模式
      useCluster: false
      #使用集群模式addr和db默认无效
      addr: 192.168.10.7:6379
      password: ""
      db: 0
      clusterAddrs:
  - php:
      #是否使用redis集群模式
      useCluster: false
      #使用集群模式addr和db默认无效
      addr: 192.168.10.7:6379
      password: ""
      db: 0
      clusterAddrs:


